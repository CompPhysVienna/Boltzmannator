<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Allow "Add to Home Screen" to launch the app full-screen, with no
     browser toolbars/bookmarks eating the (already short) landscape height. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Boltzmannator">
<meta name="theme-color" content="#1565C0">
<title>Boltzmannator</title>
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<div id="app">

  <!-- ── Left control panel ─────────────────────────────────────────── -->
  <aside id="panel">
    <div id="header-row">
      <img id="header-img" src="img/Boltzmannator_title.png" alt="Boltzmannator">
      <div id="pic-dots"></div>
    </div>

    <nav id="tabs">
      <button class="tab active" data-tab="dist" aria-label="Densities">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M4 3 V20 H21" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
          <path d="M4 19 C 7 19, 8 8, 11 8 C 14 8, 14 15, 17 15 C 19 15, 20 10, 21 9
                   L 21 19 Z" fill="currentColor" opacity="0.85"/>
        </svg><span>Densities</span>
      </button>
      <button class="tab" data-tab="map" aria-label="Map">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M4 3 V20 H21" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
          <path d="M4 19 C 10 19, 13 12, 20 4" stroke="currentColor"
                stroke-width="2.4" stroke-linecap="round"/>
        </svg><span>Map</span>
      </button>
      <button class="tab" data-tab="train" aria-label="Training">
        <span class="nabla">&#8711;</span><span>Training</span>
      </button>
    </nav>

    <div id="tab-scroll">
      <section id="tab-dist"  class="tabpanel"></section>
      <section id="tab-map"   class="tabpanel hidden"></section>
      <section id="tab-train" class="tabpanel hidden"></section>
    </div>

    <div id="panel-bottom">
      <hr class="sep">
      <div class="row spread">
        <label class="check"><input type="checkbox" id="cb-rescale" checked>
          <span>Auto-rescale x / z axes</span></label>
        <label class="switch" title="Toggle dark / light mode">
          <input type="checkbox" id="cb-dark"><span class="track"></span>
          <span class="switch-label">Dark</span></label>
      </div>
      <hr class="sep">
      <div class="row gap">
        <button id="btn-reset" class="btn btn-bluegrey grow"
                title="Reset everything to defaults">Reset</button>
        <button id="btn-exit" class="btn btn-grey grow"
                title="Close this session">Exit</button>
      </div>
      <div id="footer">&copy; 2026 Christoph Dellago</div>
    </div>
  </aside>

  <!-- ── Right plot panel ───────────────────────────────────────────── -->
  <main id="plotwrap">
    <div id="plotcard">
      <canvas id="plot"></canvas>
    </div>
  </main>

</div>
<script src="js/math.js?v=7"></script>
<script src="js/plots.js?v=7"></script>
<script src="js/app.js?v=7"></script>
</body>
</html>
